<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Koleje</title>
<meta name="theme-color" content="#7cc9f5">
<meta name="description" content="Postav železnici napříč Českem a dovez městům, co potřebují.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Koleje">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} img{max-width:100%} body{-webkit-user-select:none;user-select:none;overscroll-behavior:none}</style>
<script src="config.js"></script>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: toy-box game screen — chunky status bar, 3D diorama of Czechia, candy-coloured tool tray. Single bright daytime look by choice. */
:root{
  --sky:#a8e0ff; --sky-2:#7cc9f5; --ink:#22304d; --muted:#5d6d8f; --paper:#ffffff; --paper-2:#eef7ff;
  --sun:#ffc93c; --sun-deep:#e8a60b; --cherry:#ff5a4f; --leaf:#3cc46f; --berry:#7b6cff; --line:#d5e6f5;
  --f-display:'Baloo 2','Trebuchet MS',sans-serif;
  --f-body:'Baloo 2','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:linear-gradient(180deg,var(--sky),var(--sky-2));color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.app{height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.clockbrand{flex-direction:row;align-items:center;gap:10px}
.stclock{width:58px;height:58px;flex-shrink:0;filter:drop-shadow(0 3px 0 rgba(34,48,77,.2))}
.stclock #hHand,.stclock #mHand,.stclock #sDot{transform-origin:50px 50px;transition:transform .25s}
.clockinfo{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.clockinfo b{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}
.clockinfo small{font-size:11.5px;font-weight:700;color:var(--muted)}
.routepanel{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;background:rgba(255,255,255,.96);border-radius:16px;padding:10px 12px;box-shadow:0 6px 24px rgba(34,48,77,.25);display:grid;gap:7px}
.routepanel[hidden]{display:none}
.routepanel h4{margin:0;font-family:var(--f-display);font-size:16px}
.routepanel .rstops{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.routepanel .rstops span{background:#1e40af;color:#fff;border-radius:99px;padding:3px 10px;font-weight:800;font-size:12.5px}
.routepanel .rstops span.last{background:#38b6f5}
.routepanel .rstops i{font-style:normal;color:var(--muted);font-weight:800}
.routepanel p{margin:0;font-size:12.5px;font-weight:700;color:var(--muted)}
.routepanel .actions{margin:0;flex-wrap:wrap}
.night .stage canvas{filter:none}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1;color:var(--ink);text-wrap:balance}
h1 span{color:var(--cherry)}
.chips{display:flex;gap:6px;align-items:center;flex-shrink:0}
.chip{background:var(--paper);border-radius:14px;padding:4px 10px 2px;box-shadow:0 3px 0 rgba(34,48,77,.18);display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.chip small{font-family:var(--f-display);font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chip b{font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;transition:color .3s}
.chip b.neg{color:var(--cherry)} .chip b.up{color:var(--leaf)}
.player{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:14px;padding:5px 10px 5px 5px;box-shadow:0 3px 0 rgba(34,48,77,.18);min-width:0;border:0;text-align:left}
.player img{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:var(--paper-2)}
.player span{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.player b{font-family:var(--f-display);font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch}
.player small{font-size:11px;color:var(--muted);white-space:nowrap}
.player small.ok{color:var(--leaf)}
.bar{display:flex;gap:8px;align-items:center}
.goalpill{flex:1;min-width:0;border:0;background:var(--paper);border-radius:14px;padding:6px 10px 7px;box-shadow:0 3px 0 rgba(34,48,77,.18);text-align:left;display:grid;gap:4px;color:var(--ink)}
.goalpill{grid-template-columns:1fr 1fr;column-gap:12px}
.goalpill .gm{display:grid;gap:4px;min-width:0}
.goalpill .gt{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goalpill .gt b{color:var(--ink);font-family:var(--f-display);font-size:13.5px;margin-left:2px}
.goalpill .gbar{display:block;height:7px;border-radius:4px;background:#e3eaf4;overflow:hidden}
.goalpill .gbar i{display:block;height:100%;border-radius:4px;background:#ffb020;min-width:0;transition:width .4s}
.goalpill .gbar i.c{background:var(--leaf)}
.rowbtn{width:100%;border:0;background:none;padding-left:0;padding-right:0;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.needs{display:none!important}
.seg[hidden]{display:none}
.seg{display:flex;background:rgba(255,255,255,.55);border-radius:14px;padding:3px;flex:1;gap:3px}
.seg button{flex:1;border:0;background:none;padding:7px 8px;border-radius:11px;font-family:var(--f-display);font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 0 rgba(34,48,77,.15)}
.speed{border:0;background:var(--paper);border-radius:12px;padding:8px 12px;font-family:var(--f-display);font-weight:700;box-shadow:0 3px 0 rgba(34,48,77,.18)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.needs{flex-shrink:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:8px;overflow-x:auto;scrollbar-width:none}
.stepn{display:flex;align-items:center;gap:8px}
.stepn span{width:24px;height:24px;border-radius:50%;background:var(--berry);color:#fff;display:grid;place-items:center;font-size:13px}
.sugg{display:grid;gap:7px;margin:6px 0}
.sug{border:0;border-radius:14px;padding:10px 12px;background:var(--paper-2);text-align:left;box-shadow:0 3px 0 var(--line);display:grid;gap:4px;color:var(--ink)}
.sug b{font-family:var(--f-display);font-size:16px;font-weight:700}
.sug:active,.addw2:active,.wbtn:active{transform:translateY(2px)}
.cg{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;margin-right:9px}
.cg i{width:11px;height:11px;border-radius:50%}
.cgs{margin:-2px 0 6px}
.routeline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.rs{background:var(--ink);color:#fff;border-radius:99px;padding:5px 12px;font-weight:800;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.rs button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:20px;height:20px;font-weight:800;line-height:1}
.arr{font-weight:800;color:var(--muted)}
.actions.left{justify-content:flex-start}
details.more{margin:6px 0 8px}
details.more summary{cursor:pointer;font-weight:800;font-size:13px;color:var(--berry);padding:4px 0}
.trainstrip{overflow-x:auto;scrollbar-width:none;border-radius:14px;margin:6px 0 2px;padding:10px 8px 0;
  background:linear-gradient(#9b7653,#9b7653) 0 calc(100% - 4px)/100% 3px no-repeat, repeating-linear-gradient(90deg,#8a5a3a 0 6px,transparent 6px 16px) 0 100%/100% 9px repeat-x, linear-gradient(#c7f0ff,#e8fbe3);
  animation:rails .6s linear infinite}
.ministrip .trainstrip{transform:scale(.62);transform-origin:left bottom;margin:-14px 0 -6px;width:161%;background:none;animation:none;padding:4px 0 0}
@keyframes rails{to{background-position:0 calc(100% - 4px),-16px 100%,0 0}}
.tsin{display:flex;align-items:flex-end;width:max-content}
.wbtn{border:0;background:none;padding:0;position:relative;display:block;line-height:0}
.wbtn .wx{position:absolute;top:2px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--cherry);color:#fff;font-weight:800;font-size:13px;line-height:18px;text-align:center}
.wbtn.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:translateX(-30px) scale(.6);opacity:0}70%{transform:translateX(3px) scale(1.05);opacity:1}100%{transform:none}}
.wsvg .wh{animation:spin .55s linear infinite;transform-box:fill-box;transform-origin:center}
.wsvg .bob{animation:bob .45s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{to{transform:translateY(-1.3px)}}
.wsvg .smoke circle{fill:#fff;opacity:0;animation:puff 1.8s linear infinite;transform-box:fill-box;transform-origin:center}
.wsvg .smoke circle:nth-child(2){animation-delay:.6s}.wsvg .smoke circle:nth-child(3){animation-delay:1.2s}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-30px,-6px) scale(2.2)}}
.addgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;margin:6px 0}
.wcarousel{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.wcarousel .addw2{flex:0 0 132px;scroll-snap-align:start}
.wcarousel::-webkit-scrollbar{height:6px} .wcarousel::-webkit-scrollbar-thumb{background:#c9d6e6;border-radius:3px}
.addw2{border:0;border-radius:14px;padding:8px 10px 9px;background:var(--paper-2);text-align:left;display:grid;justify-items:center;gap:2px;box-shadow:0 3px 0 var(--line);color:var(--ink);min-width:0}
.addw2.fit{background:#e7f8ec;box-shadow:0 3px 0 #b8e6c6}
.addw2 span{display:grid;justify-items:center;text-align:center}
.addw2 b{font-weight:800;font-size:13px}
.addw2 small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.25}
.addw2 em{font-style:normal;font-weight:800;font-size:12px;color:var(--leaf);margin-top:2px}
.addw2:disabled{opacity:.45}
.btn.big{font-size:17px;padding:13px 20px}
.sub.tiny{font-size:11.5px;margin-top:0}
@media (prefers-reduced-motion:reduce){.wsvg *,.trainstrip{animation:none!important}}
.city.goal{background:#fff7dc}
.city.goal .needlist{grid-template-columns:1.45fr 1fr}
.city{background:var(--paper);border-radius:16px;padding:8px 11px;min-width:0;box-shadow:0 3px 0 rgba(34,48,77,.15)}
.city header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.city h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700}
.stars{font-family:var(--f-display);font-weight:700;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--sun);color:var(--ink);white-space:nowrap}
.stars.ok{background:var(--leaf);color:#fff}
.needlist{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:5px}
.ctile{display:grid;justify-items:center;align-content:start;text-align:center;gap:2px;background:#fff;border-radius:12px;padding:6px 4px 5px;font-size:12px;font-weight:700;line-height:1.15}
.ctile i{font-style:normal;font-size:24px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:2px solid;margin-bottom:2px}
.ctile small{color:var(--muted);font-size:11px}
.ctile .track{width:100%;height:5px;background:#dfe7f2;border-radius:4px;overflow:hidden;margin-top:2px}
.ctile .fill{display:block;height:100%;border-radius:4px}
.factbtn{margin:2px 0 6px}
.photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:6px 0 8px;padding-bottom:6px;min-height:150px}
.photos img{flex:0 0 auto;height:170px;max-width:85%;object-fit:cover;border-radius:14px;scroll-snap-align:start;background:var(--paper-2)}
.photos.loading{align-items:center;justify-content:center;background:var(--paper-2);border-radius:14px;color:var(--muted);font-weight:700}
.need{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:3px 6px;font-size:12.5px;font-weight:700;min-width:0}
.need i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.need span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need b{font-family:var(--f-display);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.need .track{grid-column:1/-1;height:6px;background:var(--paper-2);border-radius:4px;overflow:hidden}
.need .fill{display:block;height:100%;border-radius:4px;transition:width .4s}
.city .done{margin:0;color:var(--leaf);font-weight:700;font-size:13px}
.stage{flex:1;min-height:200px;position:relative;border-radius:20px;overflow:hidden;background:var(--sky);border:3px solid var(--paper);box-shadow:0 5px 0 rgba(34,48,77,.18)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.undo{position:absolute;left:10px;bottom:10px;border:0;border-radius:14px;padding:10px 14px;background:var(--paper);font-family:var(--f-display);font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(34,48,77,.2);display:flex;align-items:center;gap:6px}
.undo svg{width:20px;height:20px}
.undo small{font-family:var(--f-body);font-weight:800;font-size:11.5px;color:var(--leaf)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.zoom .rot{display:flex;gap:5px;background:rgba(255,255,255,.55);padding:4px;border-radius:15px}
.zoom .rot button{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--ink);font-size:0}
#compassN{width:22px;height:22px;display:block;position:relative;transition:none}
#compassN i{position:absolute;left:50%;top:1px;bottom:1px;width:8px;margin-left:-4px;background:linear-gradient(var(--cherry) 0 50%,#c3cede 50% 100%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.zoom button{width:42px;height:42px;border-radius:13px;border:0;background:var(--paper);font-family:var(--f-display);font-weight:700;font-size:22px;box-shadow:0 3px 0 rgba(34,48,77,.2)}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-6px);max-width:calc(100% - 24px);background:var(--paper);border-radius:14px;padding:9px 13px;font-size:13px;font-weight:700;line-height:1.35;box-shadow:0 4px 0 rgba(34,48,77,.18);pointer-events:none;transition:opacity .25s,transform .25s;opacity:0;border-left:6px solid var(--sun)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-left-color:var(--cherry)} .toast.good{border-left-color:var(--leaf)}
.float{position:absolute;left:0;top:0;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:15px;color:#fff;background:var(--leaf);padding:2px 8px;border-radius:99px;box-shadow:0 2px 0 rgba(0,0,0,.18);white-space:nowrap;will-change:transform}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tool{border:0;border-radius:15px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;background:var(--paper);box-shadow:0 4px 0 rgba(34,48,77,.2);transition:transform .08s}
.tool:active{transform:translateY(2px)}
.tool svg{width:24px;height:24px}
.tool strong{font-family:var(--f-display);font-weight:600;font-size:13.5px}
.tool small{font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.tool[aria-pressed="true"]{background:var(--berry);color:#fff;box-shadow:0 4px 0 #4f43c9}
.tool[aria-pressed="true"] small{color:#e0dcff}
.tool.depot{background:var(--sun);box-shadow:0 4px 0 var(--sun-deep)}
.tool.depot small{color:#6b4d00}
.hint{margin:0;color:var(--ink);opacity:.8;font-size:12.5px;font-weight:700;line-height:1.35;min-height:2.7em}
/* levels */
.levels{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;align-content:start;padding-bottom:12px}
.panel{grid-column:1/-1;background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 rgba(34,48,77,.15)}
.panel h2{margin:0 0 6px;font-family:var(--f-display);font-size:20px;font-weight:700}
.panel p{margin:0;color:var(--muted);font-size:13px;line-height:1.4;max-width:65ch}
.board{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.board li{display:grid;grid-template-columns:24px 30px 1fr auto;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;background:var(--paper-2);min-width:0}
.board li.me{background:#fff3c7}
.board .rank{font-family:var(--f-display);font-weight:700;color:var(--muted);text-align:center}
.board img{width:30px;height:30px;border-radius:50%}
.board .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.board .nm small{display:block;font-weight:700;font-size:11px;color:var(--muted)}
.board .sc{font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.lv{background:var(--paper);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;min-width:0;box-shadow:0 3px 0 rgba(34,48,77,.12)}
.lv .num{grid-row:1/4;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;background:var(--paper-2);color:var(--muted);font-variant-numeric:tabular-nums}
.lv.play .num{background:var(--sun);color:var(--ink)}
.lv.won .num{background:var(--leaf);color:#fff}
.lv h4{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.lv h4 em{font-style:normal;font-family:var(--f-body);font-size:11px;font-weight:800;color:var(--muted);align-self:center;white-space:nowrap}
.lv.play h4 em{color:var(--sun-deep)} .lv.won h4 em{color:var(--leaf)}
.lv p{margin:0;font-size:12.5px;line-height:1.35;color:var(--muted);min-width:0}
.lv p b{color:var(--ink);font-weight:800}
/* sheets */
.tcwrap{position:fixed;inset:0;z-index:12;display:grid;place-items:center;padding:12px;overflow-y:auto;background:rgba(34,48,77,.28);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);animation:fadein .18s}
.tcwrap[hidden]{display:none}
.tcard{box-sizing:border-box;max-width:100%;max-height:calc(100vh - 24px);overflow-y:auto;overflow-x:hidden;width:min(420px,100%);background:var(--paper);border-radius:22px;padding:16px 16px 12px;box-shadow:0 18px 50px rgba(34,48,77,.35);animation:cardin .22s ease-out}
.tcard *{min-width:0;box-sizing:border-box}
.tcard .trainstrip{max-width:100%}
.tcard .actions{flex-wrap:wrap}
.tcard header small{display:block;overflow-wrap:anywhere}
.countdown{display:grid;grid-template-columns:1fr auto;align-items:baseline;background:var(--ink);color:#fff;border-radius:14px;padding:8px 12px;margin:6px 0}
.countdown small{grid-column:1/-1;font-size:11.5px;font-weight:700;opacity:.75}
.countdown b{font-family:var(--f-display);font-size:30px;line-height:1.05}
.countdown span{font-size:12px;font-weight:700;opacity:.8}
.tt.mini{width:100%;font-size:12.5px;margin:4px 0}
.tt.mini td{padding:3px 4px}
.tt.mini td small{display:block;font-size:10px;color:var(--muted)}
.tt.mini tr.here td{background:#fff7dc}
.warnicon{font-size:30px;line-height:1}
.tcard header{display:flex;align-items:center;gap:10px}
.tcard header>div{flex:1;min-width:0}
.tcard h2{margin:0;font-family:var(--f-display);font-size:21px}
.tcard header small{color:var(--muted);font-weight:700;font-size:12.5px}
.tcard .dot{width:16px;height:16px;margin:0}
.steps{margin:6px 0 8px;padding-left:20px;display:grid;gap:5px;font-size:13.5px;font-weight:700}
.recipe{background:#fff7dc;border-radius:14px;padding:8px 11px;margin:6px 0;display:grid;gap:2px}
.recipe b{font-size:13.5px}
.recipe small{font-size:12px;color:var(--muted);font-weight:700}
.cc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.cc>div{background:var(--paper-2);border-radius:14px;padding:8px 10px;min-width:0}
.cc h4{margin:0 0 6px;font-family:var(--f-display);font-size:15px}
.cc .need{margin-bottom:5px}
.cc .need .track{background:#fff}
.cc .wagons{margin:2px 0}
.cc small.sub{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
@media (max-width:360px){ .cc{grid-template-columns:1fr} }
.verdict{font-weight:800;font-size:12.5px;padding:4px 10px;border-radius:99px;color:#fff;white-space:nowrap}
.verdict.ok{background:var(--leaf)} .verdict.bad{background:var(--cherry)}
.tcnums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.tcnums div{background:var(--paper-2);border-radius:12px;padding:7px 9px;display:grid}
.tcnums small{font-size:11px;font-weight:700;color:var(--muted)}
.tcnums b{font-family:var(--f-display);font-size:16px}
.tcard .okc{color:#1f9d55} .tcard .warn{color:var(--cherry)}
@keyframes fadein{from{opacity:0}}
@keyframes cardin{from{transform:translateY(14px) scale(.96);opacity:0}}
.scrim{position:fixed;inset:0;background:rgba(34,48,77,.35);z-index:10}
.sheet{box-sizing:border-box;overflow-x:hidden;position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:82%;overflow-y:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:11;box-shadow:0 -10px 40px rgba(34,48,77,.3)}
.sheet h2{margin:0 0 4px;font-family:var(--f-display);font-size:26px;font-weight:700;text-wrap:balance}
.sheet h3{margin:16px 0 4px;font-family:var(--f-display);font-size:16px;font-weight:600;color:var(--muted)}
.sheet p{margin:0 0 10px;line-height:1.45;font-weight:600;max-width:62ch}
.sheet ol{margin:6px 0 12px;padding-left:22px;line-height:1.45;font-weight:600;display:grid;gap:6px}
.sheet .sub{color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:10px;padding:9px 0;border-top:2px dashed var(--line)}
.row i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.row div{min-width:0}
.row div b{display:block;font-weight:800}
.row div small{color:var(--muted);font-size:12px;font-weight:700}
.row div small.warn{color:var(--cherry)} .row div small.okc{color:var(--leaf)}
.btn{border:0;border-radius:13px;padding:10px 16px;background:var(--sun);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:15.5px;white-space:nowrap;box-shadow:0 4px 0 var(--sun-deep)}
.btn:active{transform:translateY(2px)}
.btn:disabled{background:var(--paper-2);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.btn.ghost{background:var(--paper-2);box-shadow:0 4px 0 var(--line)}
.btn.small{padding:7px 11px;font-size:13.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--paper-2);border-radius:14px;padding:8px 10px}
.stats b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:11.5px;font-weight:700}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--ink);background:var(--sky)}

.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.sheet h2 .dot{width:18px;height:18px}
.wagons{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.wchip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:11px;padding:6px 9px;background:var(--paper-2);font-weight:800;font-size:12.5px;color:var(--ink)}
.wchip i{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.wchip .x{color:var(--cherry);font-size:15px;line-height:1}
.wchip.loco{background:var(--ink);color:#fff}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.addw{border:0;border-radius:12px;padding:8px 10px;background:var(--paper-2);text-align:left;display:grid;grid-template-columns:14px 1fr;gap:2px 8px;align-items:center;box-shadow:0 2px 0 var(--line);min-width:0}
.addw i{width:14px;height:14px;border-radius:4px;grid-row:1/3}
.addw b{font-weight:800;font-size:13px}
.addw small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.25}
.addw:disabled{opacity:.45}
.route{list-style:none;margin:4px 0 10px;padding:0;display:grid;gap:6px;counter-reset:st}
.route li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;background:var(--paper-2);border-radius:12px;padding:7px 8px;counter-increment:st;min-width:0}
.route li::before{content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--berry);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px}
.route li div{min-width:0}
.route li b{display:block;font-weight:800}
.route li small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.3}
.xbtn{border:0;background:var(--paper);border-radius:9px;width:30px;height:30px;font-size:18px;font-weight:800;color:var(--cherry)}
.stopchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.schip{border:0;border-radius:99px;padding:6px 11px;background:var(--paper-2);font-weight:800;font-size:12.5px;box-shadow:0 2px 0 var(--line);color:var(--ink)}
.schip:disabled{opacity:.38}
.schip.on{background:var(--berry);color:#fff;box-shadow:0 2px 0 #4f43c9}
.timebox{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.timebox .big{font-family:var(--f-display);font-weight:700;font-size:28px;min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums}
.step{display:inline-flex;gap:4px;align-items:center}
.step button{border:0;border-radius:9px;background:var(--paper-2);font-weight:800;padding:6px 9px;box-shadow:0 2px 0 var(--line);color:var(--ink)}
.ttwrap{overflow-x:auto}
.tt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
.tt td{padding:8px 4px;border-top:2px dashed var(--line);vertical-align:top}
.tt td.n{font-weight:800;min-width:7.5em}
.tt small{display:block;color:var(--muted);font-weight:700;font-size:11px}
.tt .tm{display:block;font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap}
.tt .step{margin-top:4px}
.alert{border-radius:12px;padding:9px 11px;font-size:13px;font-weight:700;line-height:1.38;margin:6px 0;background:#fff3c7;border-left:5px solid var(--sun)}
.alert.crash{background:#ffe3e0;border-left-color:var(--cherry)}
.alert.ok{background:#e3f8ea;border-left-color:var(--leaf)}
.alert b{font-family:var(--f-display)}
.row .mini{display:flex;gap:3px;margin-top:4px}
.row .mini i{width:10px;height:10px;border-radius:2px}
.row div small+small{margin-top:1px}
.row div small{display:block}
.dep{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.dep li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--paper-2);font-weight:700;font-size:13px;min-width:0}
.dep li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dep .tm{font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.dep small{color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}
.panel h2 em{font-style:normal;font-family:var(--f-body);font-size:12px;font-weight:800;color:var(--muted);margin-left:8px}
.plans .panel .row{border-top:2px dashed var(--line)}
.sub.warn{color:var(--cherry)}
.float.neg{background:var(--cherry)}
.econ{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}
.econ div{background:var(--paper-2);border-radius:12px;padding:8px 10px}
.econ small{display:block;font-size:11px;color:var(--muted);font-weight:800}
.econ b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.econ .okc{color:var(--leaf)} .econ .warn{color:var(--cherry)}
.lv p.goods{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.lv p.goods span{background:var(--paper-2);border-radius:8px;padding:2px 7px;font-size:11.5px;font-weight:700;color:var(--ink)}
.lv p.goods i{font-style:normal;color:var(--sun-deep);font-weight:800}
.alert .more{font-weight:700;font-size:12px;opacity:.75}
.seg button{padding-inline:4px}
@media (min-width:760px){ h1{font-size:30px} .hint{min-height:auto} }
@media (max-width:420px){ .player small{display:none} .player b{max-width:10ch} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }

/* ===== full-screen landscape game: the map fills the screen, everything else floats on it ===== */
.app{position:fixed;inset:0;max-width:none;margin:0;padding:0;gap:0;display:block}
#gameView{position:absolute;inset:0;display:block}
.stage{position:absolute;inset:0;border:0;border-radius:0;box-shadow:none;min-height:0}
.hud{position:absolute;z-index:5;top:calc(6px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;align-items:center;gap:6px;pointer-events:none}
.hud .top,.hud .bar{display:contents}
.hud .top>*,.hud .bar>*,.hud .chips>*{pointer-events:auto}
.hud .clockbrand{order:1;background:rgba(255,255,255,.92);border-radius:14px;padding:3px 10px 3px 4px;box-shadow:0 3px 0 rgba(34,48,77,.18);gap:6px}
.hud .stclock{width:40px;height:40px}
.hud .clockinfo b{font-size:19px}
.hud .clockinfo .eyebrow{font-size:10px}
.hud .clockinfo small{font-size:10.5px}
.hud .goalpill{order:2;flex:1;min-width:120px}
.hud .chips{order:3}
.hud .chip b{font-size:15px}
.hud #playerBtn{display:none}
.hud #sndBtn{order:4} .hud #speed{order:5} .hud #menuBtn{order:6}
.speed{min-width:44px;min-height:44px;display:grid;place-items:center;padding:6px 10px}
.menubtn{background:var(--berry);color:#fff;box-shadow:0 3px 0 #4f43c9}
.tools{position:absolute;z-index:4;left:calc(8px + env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:center;gap:6px;width:76px}
.tool{flex:0 1 auto;padding:6px 2px 5px;min-height:44px}
.tool strong{font-size:12.5px}
.undo{left:calc(96px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.zoom{right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.toast{top:calc(62px + env(safe-area-inset-top,0px))}
.routepanel{left:calc(96px + env(safe-area-inset-left,0px));right:auto;width:min(560px,calc(100% - 180px));bottom:8px;max-height:calc(100% - 80px);overflow:auto}
.hint{position:absolute;z-index:4;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100% - 330px));min-height:0;background:rgba(255,255,255,.93);border-radius:14px;padding:7px 12px;box-shadow:0 3px 0 rgba(34,48,77,.15);opacity:0;pointer-events:none;transition:opacity .4s;font-size:12px}
.hint.show{opacity:.97}
#plansView,#levelsView{position:absolute;inset:0;z-index:7;background:linear-gradient(180deg,var(--sky),var(--sky-2));padding:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 0 calc(14px + env(safe-area-inset-left,0px));display:flex}
.sheet{max-height:92%;max-width:680px}
@media (max-height:520px){ .tool small{display:none} .tool svg{width:21px;height:21px} .sheet{max-height:96%;padding-top:14px} .sheet h2{font-size:22px} }
@media (orientation:portrait){ .hud{flex-wrap:wrap} .hud .goalpill{order:7;flex-basis:100%} .tools{top:calc(118px + env(safe-area-inset-top,0px))} .toast{top:calc(118px + env(safe-area-inset-top,0px))} .hint{width:calc(100% - 200px)} .routepanel{width:calc(100% - 110px)} }
/* main menu */
.menu{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));background:radial-gradient(ellipse at 50% 40%,rgba(168,224,255,.55),rgba(34,48,77,.55));}
.mcard{width:min(860px,100%);max-height:100%;overflow:auto;background:var(--paper);border-radius:26px;box-shadow:0 8px 0 rgba(34,48,77,.22),0 20px 60px rgba(34,48,77,.3);display:grid;grid-template-columns:minmax(200px,0.9fr) 1.3fr}
.mhead{background:linear-gradient(160deg,#ffe58a,var(--sun) 60%,#ffb020);padding:22px 20px;display:flex;flex-direction:column;justify-content:center;gap:6px;border-radius:26px 0 0 26px}
.mhead h1{font-size:34px;line-height:.95}
.mhead .eyebrow{color:#6b4d00}
.mbrand{display:flex;align-items:center;gap:6px}
.mbrand h1{margin:0}
.mtrain{height:50px;width:auto;flex:none}
.mbody{padding:18px 20px;display:flex;flex-direction:column;gap:9px;min-width:0}
.mbody h2{margin:0;font-family:var(--f-display);font-size:24px}
.mbody h3{margin:10px 0 2px;font-family:var(--f-display);font-size:15px;color:var(--muted)}
.mbody p{margin:0;font-weight:600;line-height:1.4}
.mbody .sub{color:var(--muted);font-size:13px}
.mbody ol{margin:2px 0;padding-left:20px;display:grid;gap:6px;font-weight:600;line-height:1.4}
.mbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;padding:11px 14px;background:var(--paper-2);box-shadow:0 4px 0 var(--line);text-align:left;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink)}
.mbtn:active{transform:translateY(2px)}
.mbtn.primary{background:var(--leaf);color:#fff;box-shadow:0 4px 0 #23964f;font-size:20px}
.mbtn i{font-style:normal;font-size:22px;width:28px;text-align:center}
.mbtn small{display:block;font-family:var(--f-body);font-weight:700;font-size:12px;opacity:.75}
.mbtn.danger{background:#ffe3e1;box-shadow:0 4px 0 #f3b3ae;color:#b3261e}
.mrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mback{align-self:flex-start}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper-2);border-radius:14px;padding:9px 12px;font-weight:700}
.toggle input[type=range]{flex:1;max-width:220px;accent-color:var(--berry)}
.sw{border:0;border-radius:99px;width:54px;height:30px;background:#c9d6e6;position:relative;flex-shrink:0;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked="true"]{background:var(--leaf)} .sw[aria-checked="true"]::after{left:27px}
@media (max-width:640px){ .mcard{grid-template-columns:1fr} .mhead{border-radius:26px 26px 0 0;padding:14px 18px;flex-direction:row;align-items:center;flex-wrap:wrap} .mtrain{height:38px} .mhead h1{font-size:26px} }
@media (max-height:460px){ .mhead{padding:14px 16px} .mhead h1{font-size:28px} .mtrain{height:42px} .mbody{padding:12px 16px;gap:7px} .mbtn{padding:8px 12px;font-size:16.5px} .mbtn.primary{font-size:18px} }
.rotate{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(34,48,77,.86);color:#fff;text-align:center}
.rotate>div{display:grid;justify-items:center;gap:12px;font-family:var(--f-display);font-size:20px}
.rotate svg{animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

/* ===== reference style: big numbers on the map, icon column on the right, advisor with tips ===== */
.hud .chip{background:none;box-shadow:none;padding:0 4px;align-items:flex-start}
.hud .chip small{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);font-size:10px}
.hud .chip b{color:#fff;font-size:24px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 8px rgba(0,0,0,.35)}
.hud .chip b.neg{color:#ffb3ad} .hud .chip b.up{color:#b9ffcf}
.hud .chips{order:0;gap:10px}
.hud .clockbrand{order:1}
.hud .goalpill{order:2;flex:0 1 400px;margin-left:auto}
.hud #sndBtn{order:4} .hud #speed{order:5}
.hud{right:calc(96px + env(safe-area-inset-right,0px))}
.tools{left:auto;right:calc(8px + env(safe-area-inset-right,0px));top:calc(6px + env(safe-area-inset-top,0px));bottom:auto;max-height:calc(100% - 12px);justify-content:flex-start;width:78px}
.tools .tool{background:rgba(255,255,255,.93)}
.tools .tool[data-tool="pan"]{display:none}
.tools .menubtn{width:100%;min-height:46px;border-radius:15px;display:grid;place-items:center}
.building .tools{display:none}
.donebtn{position:absolute;z-index:6;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:6px 10px 6px 18px;background:#fff;font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--ink);box-shadow:0 4px 0 rgba(34,48,77,.25)}
.building .hud{right:calc(150px + env(safe-area-inset-right,0px))}
.undo{left:auto;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.zoom{right:auto;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));flex-direction:row;align-items:center}
.zoom>button{width:40px;height:40px}
.advisor{position:absolute;z-index:5;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:0;pointer-events:none;max-width:min(460px,calc(100% - 120px))}
.advface{pointer-events:auto;width:58px;height:58px;border:0;padding:0;border-radius:50%;background:none;flex-shrink:0;filter:drop-shadow(0 3px 0 rgba(34,48,77,.25));z-index:1}
.advface svg{width:100%;height:100%}
.advisor .hint{position:static;transform:none;width:auto;margin:0 0 6px -6px;padding:9px 14px 9px 16px;border-radius:4px 16px 16px 16px;background:#fff;font-size:13.5px;line-height:1.35;font-weight:700;opacity:0;transition:opacity .35s,transform .35s;transform:translateX(-8px)}
.advisor .hint.show{opacity:1;transform:none;pointer-events:auto}
.toast{top:calc(64px + env(safe-area-inset-top,0px))}
.routepanel{left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));width:auto;max-width:640px;margin:0 auto;bottom:8px}
@media (max-height:460px){ .hud .clockinfo .eyebrow{display:none} .hud .chip b{font-size:20px} .advface{width:48px;height:48px} .tools{gap:5px} .tool{min-height:40px;padding:4px 2px} }
@media (orientation:portrait){ .hud{right:calc(96px + env(safe-area-inset-right,0px))} .tools{top:calc(6px + env(safe-area-inset-top,0px))} }
.mcard{overflow:hidden;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px)}
.mbody{overflow-y:auto;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px)}
.advisor{max-width:min(400px,calc(100% - 140px))} .advisor .hint{font-size:13px}

      toast(L(`${c.name} přišla o stálé zásobování (${ln}) a klesla na úroveň ${c.lvl+1}/3.`,`${c.name} lost its steady supply (${ln}) and dropped to level ${c.lvl+1}/3.`,`${c.name} hat die feste Versorgung verloren (${ln}) und fällt auf Stufe ${c.lvl+1}/3.`),'bad',4200);

function acceptList(s){ const out=[]; if(s.levels) out.push(...levelGoods(s)); if(s.makes) out.push(...s.makes.inp); if(s.exports) out.push(...s.exports.filter(c=>!out.includes(c))); return out; }

const MAX_WORK=9;   // a stop never takes more than ~20 game minutes (20 s at 1×)
const STOP_UNLOAD=5, STOP_LOAD=10;   // every stop takes exactly 15 game minutes = 15 s at 1×

      if(!path){ ok=false; { const A=site(R[i]).name, B=site(R[(i+1)%n]).name; res.bad=L(`Mezi zastávkami ${A} a ${B} chybí trať.`,`There is no track between ${A} and ${B}.`,`Zwischen ${A} und ${B} fehlt ein Gleis.`); } break; }
      const len=pathLen(path), travel=len/SPEED, d=res.dep[i], ar=d+travel;

    for(let k=kmin;k<=kmax;k++){ const base=tr.start+k*E;
      for(const leg of pl.legs){ let t=base+leg.dep, prot=false; const p=leg.path;
        for(let j=0;j<p.length-1;j++){ const n=p[j]; if(isStationNode(n)) prot = signals.has(blockFrom(p,j).end); if(signals.has(n)) prot=true;
          const t1=t+dist(p[j],p[j+1])/SPEED, key=ekey(p[j],p[j+1]);

  for(const p of pts) if(p.edge && edgeBusy(p.edge.k)){ toast(L('Po téhle koleji zrovna jede vlak.','A train is on this track right now.','Gerade fährt ein Zug auf diesem Gleis.'),'bad'); return -1; }
  const ids=pts.map(p=> p.id!=null ? p.id : (p.edge ? (edges.has(p.edge.k) ? splitEdge(p.edge.k,p.edge.x,p.edge.y,act) : addNode(p.edge.x,p.edge.y)) : addNode(p.x,p.y)));

  const run=()=>{ if(gesture!==st) return; dragT=performance.now(); st.plan=planBuild(st.from,st.to,true); st.full=false; if(st.plan) showPreview(st.plan);
    fullTimer=setTimeout(()=>{ if(gesture!==st) return; const pl=planBuild(st.from,st.to); if(pl){ st.plan=pl; st.full=true; showPreview(pl); } },220); };
  if(performance.now()-dragT>70) run(); else dragTimer=setTimeout(run,70); }
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return; const p=local(e); pts.set(e.pointerId,p);
  if(pinch && pts.size>=2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y)||1, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    camD=Math.max(MIN_D,Math.min(maxD(), zoomInvert ? pinch.d0*d/pinch.d : pinch.d0*pinch.d/d));
    let da=Math.atan2(b.y-a.y,b.x-a.x)-pinch.a; da=Math.atan2(Math.sin(da),Math.cos(da));
    if(!pinch.rot && Math.abs(da)>0.14){ pinch.rot=true; pinch.a+=Math.sign(da)*0.14; da-=Math.sign(da)*0.14; }   // small dead zone so zooming does not twist the map
    if(pinch.rot){ camYaw=yawGoal=pinch.yaw0+da; }
    updateCamera();
    const g=groundAt(mx,my); if(g&&pinch.g){ target.x-=g.x-pinch.g.x; target.z-=g.y-pinch.g.y; clampTarget(); updateCamera(); } return; }
  if(!gesture) return;
  if(!gesture.moved && Math.hypot(p.x-gesture.sx,p.y-gesture.sy)>8){
    if(gesture.mouse){ gesture.moved=true; if(gesture.btn===0 && tool==='track' && gesture.g){ const T0=pickTarget(gesture.g); if(T0.kind!=='free'){ gesture.from=T0; gesture.act=newAct(); anchor=T0; } } }
    else { if(tool==='track' && performance.now()-gesture.t0<120) return;   // a second finger may still be coming
      gesture.moved=true;
      if(tool==='track' && gesture.g){ const T0=pickTarget(gesture.g); if(T0.kind!=='free'){ gesture.from=T0; gesture.act=newAct(); anchor=T0; } } } }
  if(!gesture.moved) return;
  // one finger from a station or a track builds; from empty ground it moves the map
  if(gesture.mouse && gesture.btn===2){ camYaw=yawGoal=gesture.yaw0+(p.x-gesture.sx)*0.008; updateCamera(); return; }   // right mouse button turns the view
  if(tool!=='track' || !gesture.from){ panBy(gesture.g,p); return; }
  if(gesture.from){ const g=groundAt(p.x,p.y); if(g) dragBuild(g); }
});
function endPtr(e){ if(!pts.has(e.pointerId)) return; const p=pts.get(e.pointerId); pts.delete(e.pointerId);
  if(pinch){ if(pts.size<2) pinch=null; gesture=null; return; }
  const gs=gesture; gesture=null; if(!gs) return;
  if(gs.act){ hidePreview(); // finish a drawn line: one clean line from start to where the finger lifted
    clearTimeout(dragTimer); clearTimeout(fullTimer);
    if(gs.to && gs.cur && Math.hypot(gs.cur.x-targetPos(gs.from).x,gs.cur.y-targetPos(gs.from).y)>=25){ const T1=gs.to; const plan=gs.full?gs.plan:(planBuild(gs.from,T1)||gs.plan); const id=plan?buildPoints(plan,gs.act):-1; if(id>=0){ anchor=T1.kind==='station'?T1:{kind:'node',id}; pushHistory(gs.act); } }
    return; }
  if(gs.moved) return;
  if(gs.mouse){ const now=performance.now();
    if(now-lastClick<320 && clickT){ clearTimeout(clickT); clickT=null; lastClick=0; zoomTo(camD/1.8,p.x,p.y); return; }
    lastClick=now; clearTimeout(clickT); clickT=setTimeout(()=>{ clickT=null; tap(p.x,p.y); },250); return; }
  tap(p.x,p.y); }
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',e=>{ pts.delete(e.pointerId); pinch=null; gesture=null; hidePreview(); });

function tap(px,py){
  if(tool==='route'){ const w0=groundAt(px,py); const st=labelAt(px,py) || (w0 && siteAt(w0.x,w0.y,Math.max(45,34*worldPerPx()))); if(!st && w0){ const tr0=trainAt(px,py); if(tr0){ showTrainCard(tr0); return; } routeVia(w0); return; } if(st){ let k=null; if(w0 && st.plat>1){ const c=nodes[st.node], dx=w0.x-c.x, dy=w0.y-c.y, lx=dx*st.ax[0]+dy*st.ax[1], ly=-dx*st.ax[1]+dy*st.ax[0], half=(st.plat-1)/2*PLAT_GAP; if(Math.abs(lx)<st.plen/2+10 && Math.abs(ly)<half+8) k=Math.max(0,Math.min(st.plat-1,Math.round((ly+half)/PLAT_GAP))); } routeAdd(st,k); return; } const tr=trainAt(px,py); if(tr) showTrainCard(tr); return; }
  { const ls=labelAt(px,py); if(ls){ showCityCard(ls); return; } }
  const w=groundAt(px,py); if(!w) return; const thr=Math.max(9,26*worldPerPx());
  if(tool==='track'){
    const T1=pickTarget(w);
    if(anchor==null){ if(T1.kind==='free'){ toast(L('Trať začíná ve stanici nebo navazuje na koleje, které už máš. Klepni na město, místo nebo na kolej.','A line starts at a station or joins track you already own. Tap a city, site or track.','Eine Strecke beginnt an einem Bahnhof oder an deinen Gleisen. Tippe auf eine Stadt, einen Ort oder ein Gleis.')); return; }
      anchor=T1; toast(T1.kind==='station'?L(`Start: ${T1.s.name}. Klepni na cíl, nebo táhni prstem. Hotovo? Přepni na Ukazatel.`,`Start: ${T1.s.name}. Tap the destination or drag your finger. Done? Switch to Pointer.`,`Start: ${T1.s.name}. Tippe auf das Ziel oder ziehe mit dem Finger. Fertig? Wechsle zum Zeiger.`):L('Navazuješ na kolej. Klepni na cíl.','Joining existing track. Tap the destination.','Anschluss an ein Gleis. Tippe auf das Ziel.')); return; }
    const a=anchorPos(), b=targetPos(T1); if(Math.hypot(a.x-b.x,a.y-b.y)<8 || (T1.kind==='station'&&anchor.kind==='station'&&T1.s===anchor.s)){ anchor=null; return; }
    const act=newAct(); const id=buildPoints(planBuild(anchor,T1),act); if(id<0) return;
    pushHistory(act); anchor = T1.kind==='station' ? T1 : {kind:'node',id};
  } else if(tool==='demolish'){
    const k=nearestEdge(w.x,w.y,thr);
    if(k){ if(edgeBusy(k)){ toast(L('Po téhle koleji zrovna jede vlak.','A train is on this track right now.','Gerade fährt ein Zug auf diesem Gleis.'),'bad'); return; } const e=edges.get(k); const back=Math.round(e.cost*0.6); delEdge(k); setMoney(money+back,true); built--;
      for(const s of [...signals]) if(!deg(s)) signals.delete(s); for(const s of [...entrySig]) if(!deg(s)) entrySig.delete(s); pushHistory({type:'demolish',removed:[{a:e.a,b:e.b,cost:e.cost}],added:[],amount:-back}); rebuildTracks(); return; }
    const n=nearestNode(w.x,w.y,thr); if(n>=0 && signals.has(n)){ signals.delete(n); netVer++; setMoney(money+COST.signalBack,true); rebuildSignals(); pushHistory({type:'signal-',signal:n,amount:-COST.signalBack}); }
  } else if(tool==='signal'){
    let n=nearestNode(w.x,w.y,Math.max(14,thr),isTrackNode);
    if(n<0){ const st=siteAt(w.x,w.y,Math.max(40,30*worldPerPx())); if(st){ toast(L('Návěstidlo patří na trať mimo stanici.','Signals go on the line, not in a station.','Signale gehören auf die Strecke, nicht in den Bahnhof.')); return; }
      const ep=nearestEdgePoint(w.x,w.y,Math.max(14,thr)); if(!ep){ toast(L('Návěstidlo patří k trati. Nejdřív postav koleje.','Signals need track. Build some first.','Signale brauchen Gleise. Baue zuerst welche.'),'bad'); return; }
      if(edgeBusy(ep.k)){ toast(L('Po téhle koleji zrovna jede vlak.','A train is on this track right now.','Gerade fährt ein Zug auf diesem Gleis.'),'bad'); return; }
      if(money<COST.signal){ toast(L('Na návěstidlo chybí peníze.','Not enough coins for a signal.','Für ein Signal fehlen Münzen.'),'bad'); return; }
      n=splitEdge(ep.k,ep.x,ep.y,null); rebuildTracks(); }
    if(signals.has(n)){ signals.delete(n); netVer++; setMoney(money+COST.signalBack,true); rebuildSignals(); pushHistory({type:'signal-',signal:n,amount:-COST.signalBack}); return; }
    if(money<COST.signal){ toast(L('Na návěstidlo chybí peníze.','Not enough coins for a signal.','Für ein Signal fehlen Münzen.'),'bad'); return; }
    signals.add(n); netVer++; setMoney(money-COST.signal); rebuildSignals(); pushHistory({type:'signal+',signal:n,amount:COST.signal});
  } else { const tr=trainAt(px,py); if(tr){ showTrainCard(tr); return; } const s=siteAt(w.x,w.y,Math.max(40,34*worldPerPx())); if(s) showCityCard(s); }
}

const _pv=new T.Vector3();
function trainAt(px,py){ let best=null, bd=30;
  for(const tr of trains){ if(!tr.parts) continue; for(const m of tr.parts){ _pv.copy(m.position).project(camera); if(_pv.z>1) continue; const sx=(_pv.x+1)/2*W, sy=(1-_pv.y)/2*H, d=Math.hypot(sx-px,sy-py); if(d<bd){ bd=d; best=tr; } } }
  return best; }

const _lu=new T.Vector3(), _rt=new T.Vector3(), _a=new T.Vector3(), _b=new T.Vector3();
function labelAt(px,py){ _lu.set(0,1,0).applyQuaternion(camera.quaternion); _rt.set(1,0,0).applyQuaternion(camera.quaternion); let best=null, bd=1e9;
  for(const s of SITES){ const sp=labelOf.get(s.id); if(!sp) continue;
    _a.copy(sp.position).project(camera); if(_a.z>1) continue; const x0=(_a.x+1)/2*W, y0=(1-_a.y)/2*H;
    _b.copy(sp.position).addScaledVector(_lu,sp.scale.y).addScaledVector(_rt,sp.scale.x*0.36).project(camera); const x1=(_b.x+1)/2*W, y1=(1-_b.y)/2*H;
    const hw=Math.abs(x1-x0)+6; if(px>x0-hw && px<x0+hw && py<y0+4 && py>y1-4){ const d=Math.abs(px-x0); if(d<bd){ bd=d; best=s; } } }
  return best; }

// a short article for the "Fun fact" button on each place card
const ICON={turiste:'🧳',pracovnici:'👷',voda:'💧',posta:'✉️',obili:'🌾',chmel:'🌿',sklo:'🥂',auta:'🚗',pivo:'🍺',vino:'🍷',ocel:'🔩',uhli:'🪨',pneu:'🛞',phm:'⛽'};
const FACTS={
 praha:['Praha leží na Vltavě a přes řeku vede 18 mostů, nejslavnější je gotický Karlův most z roku 1357. Pražský hrad je podle Guinnessovy knihy největší starobylý hradní komplex na světě. Petřínská rozhledna vznikla v roce 1891 jako malá kopie Eiffelovy věže. Hlavní nádraží má secesní halu ve stylu Fanty.',
  'Prague lies on the Vltava and 18 bridges cross the river, the most famous being the Gothic Charles Bridge from 1357. Prague Castle is listed by Guinness as the largest ancient castle complex in the world. The Petřín lookout tower was built in 1891 as a small copy of the Eiffel Tower. The main station has an Art Nouveau hall by Josef Fanta.',
  'Prag liegt an der Moldau, über den Fluss führen 18 Brücken, die berühmteste ist die gotische Karlsbrücke von 1357. Die Prager Burg gilt laut Guinness als größte alte Burganlage der Welt. Der Aussichtsturm auf dem Petřín entstand 1891 als kleine Kopie des Eiffelturms. Der Hauptbahnhof hat eine Jugendstilhalle von Josef Fanta.'],
 brno:['Brno je druhé největší město Česka a vede do něj první česká železnice: vlak z Vídně sem dojel v roce 1839. Nad městem stojí hrad Špilberk, kdysi obávané vězení, a katedrála na Petrově se dvěma štíhlými věžemi. V Brně Gregor Mendel objevil zákony dědičnosti. Brněnské výstaviště patří k největším v Evropě.',
  'Brno is the second-largest Czech city and had the first railway in the country: the train from Vienna arrived in 1839. Above the city stand Špilberk castle, once a feared prison, and the cathedral on Petrov hill with two slender spires. In Brno Gregor Mendel discovered the laws of heredity. Its exhibition grounds are among the largest in Europe.',
  'Brünn ist die zweitgrößte Stadt Tschechiens und bekam die erste Eisenbahn des Landes: 1839 kam der Zug aus Wien. Über der Stadt thronen die Burg Spielberg, einst ein gefürchtetes Gefängnis, und der Dom auf dem Petersberg. Hier entdeckte Gregor Mendel die Vererbungsregeln. Das Messegelände gehört zu den größten Europas.'],
 ostrava:['Ostrava vyrostla na uhlí a železe. V Dolních Vítkovicích dnes stojí vysoká pec, kde se tavilo železo až do roku 1998, a do jejího vršku se dá vyjet výtahem. Věž Nové radnice je nejvyšší radniční věží v Česku. Ulice Stodolní je známá tím, že tu nikdy nespí.',
  'Ostrava grew on coal and iron. In Lower Vítkovice a blast furnace that made iron until 1998 still stands, and a lift takes you to its top. The tower of the New Town Hall is the tallest town hall tower in the country. Stodolní Street is known as the street that never sleeps.',
  'Ostrava wuchs mit Kohle und Eisen. In Unter-Witkowitz steht ein Hochofen, der bis 1998 Eisen schmolz, ein Aufzug fährt bis nach oben. Der Turm des Neuen Rathauses ist der höchste Rathausturm des Landes. Die Stodolní-Straße schläft angeblich nie.'],
 plzen:['V Plzni se v roce 1842 poprvé uvařil ležák plzeňského typu, Pilsner Urquell, a dnes se tak vaří pivo po celém světě. Věž katedrály sv. Bartoloměje měří 102 metrů a je nejvyšší kostelní věží v Česku. Škodovy závody tu vyráběly lokomotivy, tramvaje i děla. Pod městem vedou kilometry starých sklepů.',
  'In 1842 Pilsen brewed the first pale lager, Pilsner Urquell, and today beer like it is brewed all over the world. The tower of St Bartholomew’s Cathedral is 102 metres tall, the highest church tower in Czechia. The Škoda works built locomotives, trams and guns here. Kilometres of old cellars run beneath the city.',
  'In Pilsen wurde 1842 das erste helle Lagerbier gebraut, das Pilsner Urquell, heute braut man es auf der ganzen Welt. Der Turm der Bartholomäuskathedrale ist 102 Meter hoch, der höchste Kirchturm Tschechiens. Die Škoda-Werke bauten hier Lokomotiven, Straßenbahnen und Kanonen. Unter der Stadt liegen kilometerlange Keller.'],
 cb:['České Budějovice mají jedno z největších čtvercových náměstí ve střední Evropě a uprostřed stojí Samsonova kašna. Z Černé věže je vidět až na Šumavu. Odtud do Lince vedla koněspřežná železnice z roku 1832, jedna z prvních na kontinentu. Budvar tu vaří pivo od roku 1895.',
  'České Budějovice has one of the largest square town squares in Central Europe, with Samson’s Fountain in the middle. From the Black Tower you can see as far as the Šumava hills. A horse-drawn railway to Linz opened here in 1832, one of the first on the continent. Budvar has brewed beer here since 1895.',
  'Budweis hat einen der größten quadratischen Marktplätze Mitteleuropas, in der Mitte steht der Samsonbrunnen. Vom Schwarzen Turm sieht man bis in den Böhmerwald. Von hier fuhr ab 1832 die Pferdeeisenbahn nach Linz, eine der ersten des Kontinents. Budvar braut hier seit 1895.'],
 krumlov:['Český Krumlov je zapsaný na seznamu UNESCO a jeho zámek je po Pražském hradě druhý největší v zemi. Barevně malovaná zámecká věž je symbolem města. V zámku hraje unikátní barokní divadlo s původními kulisami. Vltava tu obtáčí staré město v ostrém meandru.',
  'Český Krumlov is a UNESCO World Heritage site and its castle is the second largest in the country after Prague Castle. The painted castle tower is the symbol of the town. The castle has a unique Baroque theatre with its original stage sets. The Vltava wraps round the old town in a tight bend.',
  'Krumau gehört zum UNESCO-Welterbe, sein Schloss ist nach der Prager Burg das zweitgrößte im Land. Der bunt bemalte Schlossturm ist das Wahrzeichen der Stadt. Im Schloss gibt es ein einzigartiges Barocktheater mit Originalkulissen. Die Moldau umfließt die Altstadt in einer engen Schleife.'],
 valtice:['Valtice jsou srdcem Lednicko-valtického areálu, největší krajinářsky upravené oblasti v Evropě, zapsané v UNESCO. Barokní zámek patřil Lichtenštejnům. Ve sklepích zámku sídlí Salon vín, kde se každý rok vybírá stovka nejlepších moravských vín. Kolem se táhnou vinice až k rakouské hranici.',
  'Valtice is the heart of the Lednice–Valtice Cultural Landscape, the largest designed landscape in Europe and a UNESCO site. Its Baroque chateau belonged to the Liechtenstein family. In its cellars the Wine Salon picks the hundred best Moravian wines every year. Vineyards stretch all the way to the Austrian border.',
  'Feldsberg ist das Herz der Kulturlandschaft Eisgrub-Feldsberg, der größten gestalteten Landschaft Europas und UNESCO-Welterbe. Das Barockschloss gehörte den Liechtensteinern. In seinen Kellern wählt der Weinsalon jedes Jahr die hundert besten mährischen Weine. Weinberge reichen bis an die österreichische Grenze.'],
 kv:['Karlovy Vary založil podle pověsti Karel IV., když jeho pes při honu objevil horký pramen. Vřídlo tryská až do výšky 12 metrů a voda má 73 °C. Lázeňské kolonády vedou podél říčky Teplé. Každé léto se tu koná mezinárodní filmový festival a pečou se slavné lázeňské oplatky.',
  'Legend says Charles IV founded Karlovy Vary when his hound found a hot spring during a hunt. The Vřídlo spring shoots up to 12 metres high at 73 °C. Spa colonnades line the little Teplá river. Every summer the town hosts an international film festival, and it is famous for its spa wafers.',
  'Der Sage nach gründete Karl IV. Karlsbad, als sein Hund bei der Jagd eine heiße Quelle fand. Der Sprudel schießt bis zu 12 Meter hoch, das Wasser hat 73 °C. Kolonnaden säumen das Flüsschen Tepl. Jeden Sommer gibt es ein internationales Filmfestival, berühmt sind auch die Karlsbader Oblaten.'],
 kh:['Kutná Hora zbohatla na stříbře: ve středověku se tu razil pražský groš, nejdůležitější mince v zemi. Chrám sv. Barbory se třemi stanovými střechami stavěli horníci pro svou patronku. Nedaleko v Sedlci je kostnice vyzdobená kostmi asi 40 000 lidí. Celé historické centrum je v UNESCO.',
  'Kutná Hora grew rich on silver: in the Middle Ages it minted the Prague groschen, the most important coin in the land. St Barbara’s Church with its three tent roofs was built by miners for their patron saint. Nearby in Sedlec is an ossuary decorated with the bones of about 40,000 people. The whole old town is a UNESCO site.',
  'Kuttenberg wurde mit Silber reich: Im Mittelalter prägte man hier den Prager Groschen, die wichtigste Münze des Landes. Die Barbarakirche mit ihren drei Zeltdächern bauten Bergleute für ihre Schutzheilige. Im nahen Sedletz steht ein Beinhaus mit den Knochen von etwa 40 000 Menschen. Die ganze Altstadt ist UNESCO-Welterbe.'],
 telc:['Telč má jedno z nejkrásnějších náměstí v Evropě: kolem něj stojí renesanční a barokní domy s barevnými štíty a podloubím. Město obklopují rybníky, které ho dřív chránily jako vodní hradby. Renesanční zámek nechal přestavět Zachariáš z Hradce. Od roku 1992 je Telč zapsaná v UNESCO.',
  'Telč has one of the most beautiful squares in Europe, lined with Renaissance and Baroque houses with colourful gables and arcades. The town is ringed by ponds that once protected it like a moat. Zachariáš of Hradec rebuilt its Renaissance chateau. Telč has been a UNESCO site since 1992.',
  'Teltsch hat einen der schönsten Plätze Europas mit Renaissance- und Barockhäusern, bunten Giebeln und Laubengängen. Teiche umgeben die Stadt und schützten sie früher wie ein Wassergraben. Zacharias von Neuhaus ließ das Renaissanceschloss umbauen. Seit 1992 gehört Teltsch zum UNESCO-Welterbe.'],
 letiste:['Letiště Václava Havla Praha je největší letiště v Česku a ročně jím projde přes 13 milionů cestujících. Otevřeno bylo v roce 1937 a jeho první hala je dnes kulturní památka. Z letiště se dá letět do více než 150 měst. Vlakem ho chtějí spojit s Prahou rychlodrážkou.',
  'Václav Havel Airport Prague is the largest airport in Czechia, with more than 13 million passengers a year. It opened in 1937 and its first terminal is now a listed building. You can fly from here to more than 150 cities. A fast rail link to the city centre is planned.',
  'Der Flughafen Václav Havel Prag ist der größte Tschechiens mit über 13 Millionen Fluggästen im Jahr. Er wurde 1937 eröffnet, das erste Terminal steht heute unter Denkmalschutz. Von hier gibt es Flüge in mehr als 150 Städte. Eine schnelle Bahnverbindung in die Innenstadt ist geplant.'],
 lipno:['Lipno je největší vodní plocha v Česku, přehrada na Vltavě dlouhá 42 kilometrů. Říká se mu jihočeské moře. V létě se tu jachtaří, v zimě se po zamrzlé hladině bruslí na stezce dlouhé až 11 kilometrů. Nad jezerem vede stezka korunami stromů.',
  'Lipno is the largest body of water in Czechia, a 42-kilometre reservoir on the Vltava, nicknamed the South Bohemian Sea. In summer people sail here, and in winter they skate on a trail up to 11 kilometres long across the ice. A treetop walk rises above the lake.',
  'Lipno ist das größte Gewässer Tschechiens, ein 42 Kilometer langer Stausee an der Moldau, auch Südböhmisches Meer genannt. Im Sommer wird gesegelt, im Winter läuft man auf einer bis zu 11 Kilometer langen Eisbahn Schlittschuh. Über dem See führt ein Baumwipfelpfad.'],
 zatec:['Žatecký chmel patří k nejlepším na světě a pěstuje se tu už přes 700 let. Krajina chmelnic se sušárnami a vysokými konstrukcemi pro chmel je zapsaná v UNESCO. Ve městě stojí Chmelový maják a chmelový orloj. Žatecký chmel dává pivu jemnou hořkost.',
  'Žatec hops are among the best in the world and have been grown here for over 700 years. The landscape of hop gardens, drying kilns and tall hop frames is a UNESCO site. The town has a Hop Lighthouse and a hop astronomical clock. Žatec hops give beer its gentle bitterness.',
  'Saazer Hopfen gehört zu den besten der Welt und wird hier seit über 700 Jahren angebaut. Die Landschaft mit Hopfengärten, Darren und hohen Gerüsten ist UNESCO-Welterbe. In der Stadt stehen ein Hopfenleuchtturm und eine Hopfenuhr. Saazer Hopfen gibt dem Bier seine feine Bittere.'],
 litvinov:['V Litvínově stojí velká rafinerie a chemička, kde se z ropy vyrábí benzin, nafta i plasty. Ropa sem přitéká potrubím z Německa a z Ruska. Okolí kdysi rozryly povrchové doly na hnědé uhlí. Litvínov je známý i hokejem, zdejší klub hraje nejvyšší soutěž už od roku 1959.',
  'Litvínov has a large refinery and chemical works that turn crude oil into petrol, diesel and plastics. The oil arrives by pipeline from Germany and Russia. Opencast brown-coal mines once tore up the land around it. Litvínov is also known for ice hockey, its club has played in the top league since 1959.',
  'In Litvínov stehen eine große Raffinerie und ein Chemiewerk, die aus Erdöl Benzin, Diesel und Kunststoffe machen. Das Öl kommt per Pipeline aus Deutschland und Russland. Tagebaue für Braunkohle haben die Umgebung einst aufgewühlt. Bekannt ist Litvínov auch für Eishockey, der Klub spielt seit 1959 in der höchsten Liga.'],
 hana:['Haná je úrodná rovina kolem Olomouce a Prostějova, říká se jí obilnice Moravy. Rodí se tu pšenice a ječmen na slad. Hanáci mají své nářečí a pestré kroje. Z Hané pochází i slavné olomoucké tvarůžky.',
  'Haná is the fertile plain around Olomouc and Prostějov, known as the granary of Moravia. Wheat and malting barley grow here. The people of Haná have their own dialect and colourful folk costumes. The famous Olomouc cheese also comes from here.',
  'Die Hanna ist die fruchtbare Ebene um Olmütz und Proßnitz, die Kornkammer Mährens. Hier wachsen Weizen und Braugerste. Die Hannaken haben einen eigenen Dialekt und farbenfrohe Trachten. Auch der berühmte Olmützer Quargel stammt von hier.'],
 karvina:['Karviná leží na černém uhlí, které se tu těží hlubinně přes 200 let. Poddolovaný kostel sv. Petra z Alkantary se kvůli poklesu půdy naklonil o 7 stupňů a říká se mu šikmý kostel. Těžba proměnila krajinu a vznikly nové rybníky v propadlinách. Lázně Darkov léčí jódobromovou solankou.',
  'Karviná sits on black coal that has been mined deep underground for over 200 years. The Church of St Peter of Alcantara tilted 7 degrees as the ground sank and is called the leaning church. Mining changed the landscape and new ponds filled the hollows. Darkov spa heals with iodine-bromine brine.',
  'Karwin liegt auf Steinkohle, die hier seit über 200 Jahren unter Tage abgebaut wird. Die Kirche des hl. Peter von Alcantara neigte sich durch Bergsenkungen um 7 Grad und heißt die schiefe Kirche. Der Bergbau formte die Landschaft, in Senken entstanden Teiche. Das Bad Darkau heilt mit Jod-Brom-Sole.'],
 trinec:['Třinecké železárny pod Beskydy fungují od roku 1839 a vyrábějí kolejnice, dráty i ocelové tyče. Velkou část kolejnic na českých tratích vyrobili právě tady. Hokejový klub Oceláři je pojmenovaný podle zdejších hutníků. Okolí patří k nejhezčím horám na Moravě.',
  'The Třinec ironworks below the Beskids have run since 1839 and make rails, wire and steel bars. Much of the rail on Czech lines was rolled right here. The hockey club Oceláři, the Steelmen, is named after the local workers. The mountains around are among the prettiest in Moravia.',
  'Das Eisenwerk Třinec unter den Beskiden läuft seit 1839 und stellt Schienen, Draht und Stahlstangen her. Ein großer Teil der Schienen tschechischer Strecken wurde hier gewalzt. Der Hockeyklub Oceláři, die Stahlwerker, ist nach den Arbeitern benannt. Die Berge ringsum gehören zu den schönsten Mährens.'],
 otrokovice:['V Otrokovicích vybudoval Tomáš Baťa továrny na boty, pneumatiky i vlastní letiště. Dnes se tu vyrábějí pneumatiky Barum pro auta po celé Evropě. Město leží na soutoku Moravy a Dřevnice. Baťova architektura z červených cihel je k vidění dodnes.',
  'In Otrokovice Tomáš Baťa built factories for shoes and tyres and even his own airfield. Today Barum tyres for cars all over Europe are made here. The town lies where the Dřevnice joins the Morava river. Baťa’s red-brick architecture can still be seen.',
  'In Otrokovice baute Tomáš Baťa Fabriken für Schuhe und Reifen und sogar einen eigenen Flugplatz. Heute entstehen hier Barum-Reifen für Autos in ganz Europa. Die Stadt liegt am Zusammenfluss von Dřevnice und March. Baťas Architektur aus rotem Backstein ist noch zu sehen.'],
 novybor:['Nový Bor je centrem českého sklářství, sklo se tu foukalo už v 18. století. Zdejší lustry visí v palácích, hotelech i divadlech po celém světě. Ve sklárnách můžete vidět sklaře, jak foukají rozžhavené sklo. Ve městě je Sklářské muzeum.',
  'Nový Bor is the centre of Czech glassmaking, glass was blown here as early as the 18th century. Its chandeliers hang in palaces, hotels and theatres all over the world. In the glassworks you can watch glassblowers shape molten glass. The town has a Glass Museum.',
  'Haida ist das Zentrum der böhmischen Glasmacherkunst, schon im 18. Jahrhundert wurde hier Glas geblasen. Lüster von hier hängen in Palästen, Hotels und Theatern auf der ganzen Welt. In den Glashütten sieht man Glasbläsern bei der Arbeit zu. Die Stadt hat ein Glasmuseum.'],
 mikulov:['Mikulov s bílým zámkem na skále je vinařskou metropolí jižní Moravy. Nad městem se zvedají vápencové Pálava a Svatý kopeček s křížovou cestou. Vína odsud mají díky vápenci minerální chuť. V zámeckém sklepě stojí obří sud na víc než 100 000 litrů.',
  'Mikulov, with its white chateau on a rock, is the wine capital of South Moravia. Above the town rise the limestone Pálava hills and Holy Hill with its Stations of the Cross. The limestone gives the local wines a mineral taste. The chateau cellar holds a giant barrel of more than 100,000 litres.',
  'Nikolsburg mit dem weißen Schloss auf dem Felsen ist die Weinhauptstadt Südmährens. Über der Stadt erheben sich die Kalkberge der Pollauer Berge und der Heilige Berg mit Kreuzweg. Der Kalk gibt den Weinen einen mineralischen Geschmack. Im Schlosskeller steht ein Riesenfass für über 100 000 Liter.'],
 mb:['V Mladé Boleslavi založili Laurin a Klement v roce 1895 firmu na kola, ze které vyrostla Škoda Auto. Dnes tu z linky sjede víc než tisíc aut denně. V muzeu Škoda můžete vidět první motocykly i závodní auta. Škodovka je jeden z největších výrobců v Česku.',
  'In Mladá Boleslav, Laurin and Klement started a bicycle company in 1895 that grew into Škoda Auto. Today more than a thousand cars a day roll off the lines here. The Škoda Museum shows the first motorcycles and racing cars. Škoda is one of the biggest manufacturers in Czechia.',
  'In Jungbunzlau gründeten Laurin und Klement 1895 eine Fahrradfirma, aus der Škoda Auto wurde. Heute laufen hier täglich über tausend Autos vom Band. Das Škoda-Museum zeigt die ersten Motorräder und Rennwagen. Škoda gehört zu den größten Herstellern Tschechiens.']
};

  if(!d.id){ setMoney(money-pr.cost); const tr=makeTrain({name:d.name,color:d.color,consist:d.consist,route:d.route,start:d.start,every:d.every,waits:d.waits,bought:pr.cost,auto:!d.manual,plats:d.plats||null,vias:d.vias||null,split:d.split||null});
    toast(L(`${tr.name} nakládá ve stanici ${site(tr.route[0]).name}, odjezd v ${hm(tr.depAt)}.`,`${tr.name} is loading at ${site(tr.route[0]).name}, departs at ${hm(tr.depAt)}.`,`${tr.name} lädt in ${site(tr.route[0]).name}, Abfahrt um ${hm(tr.depAt)}.`),'good',4200);
    dirty(); closeSheet(); const n0=nodes[site(tr.route[0]).node]; target.x=n0.x-CX; target.z=n0.y-CZ; camD=Math.min(camD,520); updateCamera(); return; }
  else { const tr=trains.find(t=>t.id===d.id); if(!tr){ showTrains(); return; }
    setMoney(money-pr.cost+pr.refund);
    const oldLoads=tr.loads; tr.consist=[...d.consist]; tr.loads=tr.consist.map((w,i)=>oldLoads[i] && WAGONS[w].carries.includes(oldLoads[i].c) ? oldLoads[i] : null);
    const routeChanged = tr.route.join()!==d.route.join(); tr.route=[...d.route]; tr.start=d.start; tr.every=d.every; tr.waits=[...d.waits]; tr.auto=!d.manual; tr.plats=d.plats||null; tr.vias=d.vias||null; tr.split=d.split||null;
    if(routeChanged){ tr.cycleBase=null; if(tr.at!=null){ const i=tr.route.indexOf(nodeSite.get(tr.at).id); if(i>=0){ tr.stopIdx=i; } else { tr.stopIdx=tr.route.length-1; } if(tr.st==='ready'){ tr.depAt=tr.plannedDep=(tr.stopIdx===0?nextSlot(tr,gameMin):gameMin); } } else tr.nextIdx=-1; }
    else if(tr.st==='ready' && tr.stopIdx===0){ tr.depAt=tr.plannedDep=nextSlot(tr,gameMin); }
    buildTrainMesh(tr); /*quiet*/ }
  dirty(); showTrains();
}

function showSite(s){
  const n=s.node, here=trainsAt(n).length;
  const kind = s.kind==='airport'?L('Letiště','Airport','Flughafen'):s.kind==='city'?L('Město','City','Stadt'):(s.kind==='factory'?L('Továrna','Factory','Fabrik'):L('Místo','Site','Ort'));
  let h=`<span class="eyebrow">${kind} · ${s.plat} ${kolej(s.plat)} ${L('ve stanici','at the station','im Bahnhof')}</span><h2>${s.name}</h2>`;
  const st=Object.keys(s.stock).filter(c=>isSourceOf(s,c));
  if(st.length) h+=`<h3>${L('Sklad k odvozu','Ready for pickup','Zum Abholen bereit')}</h3><div class="wagons">`+st.map(c=>`<span class="wchip"><i style="background:${CARGO[c].color}"></i>${CARGO[c].name} <b>${s.stock[c]}/${CAP}</b></span>`).join('')+`</div>`;
  if(s.exports) h+=`<h3>${L('Vývoz do světa','Exports to the world','Export in die Welt')} · +30 %</h3><div class="wagons">`+s.exports.map(c=>`<span class="wchip"><i style="background:${CARGO[c].color}"></i>${CARGO[c].name}</span>`).join('')+`</div><p class="sub">${L(`Odvezeno do světa: ${exported} vozů. Letiště bere vývoz bez omezení.`,`Shipped abroad: ${exported} wagons. The airport takes any amount.`,`Ins Ausland verschickt: ${exported} Wagen. Der Flughafen nimmt jede Menge.`)}</p>`;
  if(s.prod) h+=`<p class="sub">${L('Vyrábí','Produces','Produziert')}: ${Object.entries(s.prod).map(([c,m])=>`${lc(CARGO[c].name)} ${L('každých','every','alle')} ${m} min`).join(', ')}.</p>`;
  if(s.makes){ const m=s.makes, ins=m.inp.map(c=>'1× '+lc(CARGO[c].name)).join(' + '), out='1× '+lc(CARGO[m.out].name);
    h+=`<h3>${L('Výroba','Production','Produktion')}</h3><p>${L(`Z ${ins} vyrobí ${out} za ${m.every} min.`,`Turns ${ins} into ${out} in ${m.every} min.`,`Macht aus ${ins} in ${m.every} min ${out}.`)}</p><div class="wagons">`+m.inp.map(c=>`<span class="wchip"><i style="background:${CARGO[c].color}"></i>${CARGO[c].name} ${L('na skladě','in stock','auf Lager')} <b>${s.inbuf[c]||0}</b></span>`).join('')+`</div>`; }
  if(s.levels){ const need=s.done?null:s.levels[s.lvl];
    h+= need ? `<h3>${L('Potřebuje','Needs','Braucht')} · ${L('úroveň','level','Stufe')} ${s.lvl+1}/3</h3><p class="sub">${L('Na další úroveň potřebuje od každé suroviny 5 vozů během 10 minut. Suroviny z nižších úrovní musí chodit dál, jinak město klesne.','To level up it needs 5 wagons of each good within 10 minutes. Goods from lower levels must keep coming, or the city drops back.','Für die nächste Stufe braucht sie 5 Wagen jeder Ware innerhalb von 10 Minuten. Waren der unteren Stufen müssen weiter kommen, sonst fällt die Stadt zurück.')}</p>`+Object.entries(need).map(([k,v])=>`<div class="row"><i style="background:${CARGO[k].color}"></i><div><b>${CARGO[k].name}</b><small>${num(CARGO[k].pay)} ${COIN()} ${L('za vůz na 100 km','per wagon per 100 km','pro Wagen auf 100 km')} · ${L('dovezeno','delivered','geliefert')} ${Math.min(s.got[k]||0,v)}/${v} · ${L('odkud','from','von')}: ${SITES.filter(x=>isSourceOf(x,k)).map(x=>x.name).join(', ')}</small></div><span></span></div>`).join('') : `<p class="sub">${L('Všechny tři úrovně jsou splněné.','All three levels are complete.','Alle drei Stufen sind erfüllt.')}</p>`; }
  const {visits}=predict(trains,gameMin,gameMin+1440); const vs=(visits.get(n)||[]).filter(v=>v.d>=gameMin).sort((a,b)=>a.d-b.d).slice(0,6);
  h+=`<h3>${L('Odjezdy','Departures','Abfahrten')} · ${L('obsazeno','occupied','belegt')} ${here}/${s.plat}</h3>`+(vs.length?`<ul class="dep">`+vs.map(v=>`<li><span class="tm">${hm(v.d)}</span><span><i class="dot" style="background:${v.tr.color}"></i>${esc(v.tr.name)} → ${site(v.tr.route[(v.i+1)%v.tr.route.length]).name}</span><small>${L('příj.','arr.','an')} ${hm(v.a)}</small></li>`).join('')+`</ul>`:`<p class="sub">${L('Odsud zatím žádný vlak nejezdí.','No trains leave from here yet.','Von hier fährt noch kein Zug.')}</p>`);
  openSheet(h+`<div class="actions"><button class="btn" data-open="new" data-from="${s.id}">${L('Nový vlak odsud','New train from here','Neuer Zug von hier')}</button><button class="btn ghost" data-close>${L('Zavřít','Close','Schließen')}</button></div>`,'site');
}

sheet.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.ed){ edAction(b); return; }
  if(b.dataset.open){ openEditor(b.dataset.open==='new'?0:+b.dataset.open, b.dataset.from); return; }
  if(b.dataset.lang){ setLang(b.dataset.lang); return; }
  if(b.dataset.close!==undefined){ closeSheet(); return; }
  if(b.dataset.levels!==undefined){ closeSheet(); showTab('levels'); return; }
  if(b.dataset.plans!==undefined){ closeSheet(); showTab('plans'); return; }
  if(b.dataset.site){ showSite(site(b.dataset.site)); return; }
  if(b.dataset.backsite){ closeSheet(); showCityCard(site(b.dataset.backsite)); return; }
  if(b.dataset.reset!==undefined){ resetGame(); closeSheet(); return; }
  if(b.dataset.zoom!==undefined){ zoomInvert=b.dataset.zoom==='1'; try{ localStorage.setItem('zi-zoom2',zoomInvert?'1':'0'); }catch(e){} $('playerBtn').click(); return; }
  if(b.dataset.glogin!==undefined){ googleLogin(); return; }
  if(b.dataset.glogout!==undefined){ googleLogout(); closeSheet(); return; }
});

function plansHtml(){
  let h=`<div class="actions left"><button class="btn small ghost" data-back>← ${L('Zpět na mapu','Back to the map','Zurück zur Karte')}</button></div>`+(trains.length?'':`<section class="panel"><p>${L('Zatím nejezdí žádné vlaky.','No trains are running yet.','Noch fahren keine Züge.')}</p></section>`);
  if(trains.length){ h+=`<section class="panel"><h2>${L('Vlaky','Trains','Züge')}</h2>`+trains.map(tr=>`<div class="row"><i style="background:${tr.color}"></i><div><b>${esc(tr.name)} · ${tr.route.map(id=>site(id).name).join(' → ')}</b><small class="${statusCls(tr)}">${statusText(tr)}</small><small>${L('odjezd','departs','Abfahrt')} ${hm(tr.start)}, ${everyLabel(tr.every)}</small></div><button class="btn small ghost" data-open="${tr.id}">${L('Upravit','Edit','Bearbeiten')}</button></div>`).join('')+`</section>`;
    const {visits}=predict(trains,gameMin,gameMin+1440);
    for(const [node,vs] of visits){ const s=nodeSite.get(node); const rows=vs.filter(v=>v.d>=gameMin).sort((a,b)=>a.d-b.d).slice(0,8);
      h+=`<section class="panel"><h2>${s.name}<em>${s.plat} ${kolej(s.plat)}</em></h2><ul class="dep">`+(rows.length?rows.map(v=>`<li><span class="tm">${hm(v.d)}</span><span><i class="dot" style="background:${v.tr.color}"></i>${esc(v.tr.name)} → ${site(v.tr.route[(v.i+1)%v.tr.route.length]).name}</span><small>${L('příj.','arr.','an')} ${hm(v.a)}</small></li>`).join(''):`<li><span>${L('Dnes už nic','Nothing more today','Heute nichts mehr')}</span></li>`)+`</ul></section>`; } }
  return h;
}
