function sndUpdate(){ if(!SND.ready) return; const ctx=SND.ctx;
  const zf=Math.max(0.05,Math.min(1,1.15-Math.log(camD/110)/Math.log(22))); setG(SND.wind.gain, 0.03+0.03*(1-zf));
  // all places together must never get louder than one place heard up close
  const gs=SND.voices.map(v=>{ const h=hearing(v.x,v.y); let g=v.base*h.g; if(v.kind==='city' && daylight()<0.3) g*=0.45; if(v.kind==='airport' && planeT>=0) g*=3.2; v.h=h.g; return [g,h]; });
  const sum=gs.reduce((a,x)=>a+x[0],0); SND.norm=Math.min(1,(0.06+0.2*zf)/(sum||1));
  SND.voices.forEach((v,i)=>{ setG(v.out.gain, gs[i][0]*SND.norm); if(v.pan) setG(v.pan.pan, gs[i][1].pan*0.8); });
  // trains: pick the most audible ones
  const ranked=trains.filter(t=>t.parts && t.st!=='dead').map(t=>{ const m=t.parts[0].position; const h=hearing(m.x+CX,m.z+CZ); return {t,h}; }).sort((a,b)=>b.h.g-a.h.g).slice(0,SND.trainV.length);
  SND.trainV.forEach((tv,i)=>{ const r=ranked[i]; if(!r || r.h.g<0.004){ setG(tv.out.gain,0); tv.tr=null; return; }
    const t=r.t, moving=t.st==='run', sp=SPEEDS[speedIdx]?1:0; tv.tr=t;
    setG(tv.out.gain, r.h.g*(moving?0.32:0.12)*(sp?1:0.3)*(0.35+0.65*zf)); if(tv.pan) setG(tv.pan.pan, r.h.pan*0.8);
    setG(tv.o.frequency, moving?78+Math.min(3,SPEEDS[speedIdx])*6:52); setG(tv.o2.frequency, moving?156:104); setG(tv.rg.gain, moving?0.9:0.15);
    // wheels over rail joints: ta-dam ... ta-dam
    if(moving && sp){ tv.clk-=0.1*Math.min(4,SPEEDS[speedIdx]); if(tv.clk<=0){ tv.clk=0.9; clack(tv.out,0); clack(tv.out,0.13); } } }); }
setInterval(sndUpdate,100);
// leaving the game (other app, other tab, screen off) silences it at once
function sndPause(off){ if(!SND.ctx) return; try{ if(off) SND.ctx.suspend(); else if(SND.on) SND.ctx.resume(); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ sndPause(document.hidden); if(document.hidden && ready && !window.__TEST){ clearTimeout(saveTimer); save(); } });
window.addEventListener('pagehide',()=>{ sndPause(true); if(ready && !window.__TEST) saveLocal(); }); window.addEventListener('pageshow',()=>sndPause(document.hidden));
window.addEventListener('blur',()=>sndPause(true)); window.addEventListener('focus',()=>sndPause(false));
// --- one-shot sounds ---
function envGain(at,peak,a,d){ const g=SND.ctx.createGain(), t=SND.ctx.currentTime+at; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); return g; }
function clack(out,at){ if(!SND.ready) return; const ctx=SND.ctx, s=ctx.createBufferSource(); s.buffer=SND.white; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1700; f.Q.value=2; const g=envGain(at,0.9,0.003,0.07); s.connect(f); f.connect(g); g.connect(out); s.start(ctx.currentTime+at,Math.random()*2,0.12); }
function placed(x,y,mult){ if(!SND.ready || !SND.on || document.hidden) return null; const h=hearing(x,y), g=h.g*(mult||1)*(SND.norm==null?1:Math.max(0.35,SND.norm)); if(g<0.01) return null; const ctx=SND.ctx, out=ctx.createGain(); out.gain.value=g;
  if(ctx.createStereoPanner){ const p=ctx.createStereoPanner(); p.pan.value=h.pan*0.8; out.connect(p); p.connect(SND.master); } else out.connect(SND.master); setTimeout(()=>{ try{ out.disconnect(); }catch(e){} },6000); return out; }
function sndHorn(x,y,two){ const out=placed(x,y,0.5); if(!out) return; const ctx=SND.ctx;
  [[0,0.55,370],[two?0.6:-1,0.5,311]].forEach(([at,len,f])=>{ if(at<0) return; for(const m of [1,1.5]){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=f*m; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1800; const g=envGain(at,0.18/m,0.03,len); o.connect(lp); lp.connect(g); g.connect(out); o.start(ctx.currentTime+at); o.stop(ctx.currentTime+at+len+0.1); } }); }
function sndCarHorn(x,y){ const out=placed(x,y,0.35); if(!out) return; const ctx=SND.ctx, f=380+Math.random()*120, len=0.12+Math.random()*0.35, n=Math.random()<0.4?2:1;
  for(let k=0;k<n;k++) for(const m of [1,1.26]){ const o=ctx.createOscillator(); o.type='square'; o.frequency.value=f*m; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200; const g=envGain(k*(len+0.08),0.08,0.01,len); o.connect(lp); lp.connect(g); g.connect(out); o.start(ctx.currentTime+k*(len+0.08)); o.stop(ctx.currentTime+k*(len+0.08)+len+0.05); } }
function sndSqueal(){}   // brakes stay quiet: the old squeal sounded like a burst steam pipe
// the dispatcher's whistle before a train leaves: short, soft, with the pea's trill
function sndWhistle(x,y){ const out=placed(x,y,0.18); if(!out) return; const ctx=SND.ctx, o=ctx.createOscillator(), lfo=ctx.createOscillator(), lg=ctx.createGain(), am=ctx.createGain();
  o.type='sine'; o.frequency.value=2500; lfo.type='sine'; lfo.frequency.value=28; lg.gain.value=0.35; lfo.connect(lg); am.gain.value=0.65; lg.connect(am.gain);
  const g=envGain(0,0.035,0.02,0.42); o.connect(am); am.connect(g); g.connect(out); for(const z of [o,lfo]){ z.start(); z.stop(ctx.currentTime+0.5); } }
function sndWrench(x,y){ const out=placed(x,y,0.6); if(!out) return; const ctx=SND.ctx, s=ctx.createBufferSource(); s.buffer=SND.white; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2400; f.Q.value=3;
  const am=ctx.createGain(); am.gain.value=0; const lfo=ctx.createOscillator(); lfo.type='square'; lfo.frequency.value=22+Math.random()*8; const lg=ctx.createGain(); lg.gain.value=0.5; lfo.connect(lg); lg.connect(am.gain);
  const len=0.35+Math.random()*0.7, g=envGain(0,0.5,0.02,len); s.connect(f); f.connect(am); am.connect(g); g.connect(out); s.start(ctx.currentTime,Math.random()*2,len+0.2); lfo.start(); lfo.stop(ctx.currentTime+len+0.2); }
function sndClank(x,y){ const out=placed(x,y,0.4); if(!out) return; const ctx=SND.ctx; for(const f of [523,1189,2027,3110]){ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f*(0.9+Math.random()*0.2); const g=envGain(0,0.08,0.002,0.9*523/f+0.2); o.connect(g); g.connect(out); o.start(); o.stop(ctx.currentTime+1.4); } }
function sndBird(x,y){ const out=placed(x,y,0.3); if(!out) return; const ctx=SND.ctx, n=2+Math.floor(Math.random()*4), base=2600+Math.random()*1800;
  for(let k=0;k<n;k++){ const o=ctx.createOscillator(), at=k*0.13, t=ctx.currentTime+at; o.type='sine'; o.frequency.setValueAtTime(base,t); o.frequency.exponentialRampToValueAtTime(base*(1.3+Math.random()*0.4),t+0.07); const g=envGain(at,0.05,0.01,0.08); o.connect(g); g.connect(out); o.start(t); o.stop(t+0.12); } }
function sndJet(x,y){ const out=placed(x,y,1.2); if(!out) return; const ctx=SND.ctx, s=ctx.createBufferSource(); s.buffer=SND.pink; const f=ctx.createBiquadFilter(); f.type='lowpass'; const t=ctx.currentTime;
  f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(2600,t+3); f.frequency.exponentialRampToValueAtTime(500,t+7); const g=envGain(0,0.9,1.5,5.5); s.connect(f); f.connect(g); g.connect(out); s.start(t,0,7.5); }
function sndBoom(x,y){ const out=placed(x,y,2.5) || (SND.ready&&SND.on?placedUI(0.5):null); if(!out) return; const ctx=SND.ctx, s=ctx.createBufferSource(); s.buffer=SND.brown; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; const g=envGain(0,1,0.01,2.4); s.connect(f); f.connect(g); g.connect(out); s.start(ctx.currentTime,Math.random(),2.6); }
function placedUI(v){ if(!SND.ready || !SND.on || document.hidden) return null; const g=SND.ctx.createGain(); g.gain.value=v; g.connect(SND.master); setTimeout(()=>{ try{ g.disconnect(); }catch(e){} },4000); return g; }
function sndCoin(x,y){ const out=placed(x,y,0.5) || placedUI(0.05); if(!out) return; const ctx=SND.ctx; [[0,1319],[0.07,1760]].forEach(([at,f])=>{ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f; const g=envGain(at,0.25,0.005,0.35); o.connect(g); g.connect(out); o.start(ctx.currentTime+at); o.stop(ctx.currentTime+at+0.5); }); }
function sndBuild(){ const out=placedUI(0.35); if(!out) return; const ctx=SND.ctx; for(let k=0;k<3;k++){ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=180-k*20; const g=envGain(k*0.09,0.5,0.005,0.12); o.connect(g); g.connect(out); o.start(ctx.currentTime+k*0.09); o.stop(ctx.currentTime+k*0.09+0.2); } }
function sndFanfare(){ const out=placedUI(0.3); if(!out) return; const ctx=SND.ctx; [523,659,784,1047].forEach((f,k)=>{ const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f; const g=envGain(k*0.11,0.3,0.01,0.35); o.connect(g); g.connect(out); o.start(ctx.currentTime+k*0.11); o.stop(ctx.currentTime+k*0.11+0.5); }); }
// random life: car horns in cities, impact wrenches at Škoda, clanks at the ironworks, birds in the country
setInterval(()=>{ if(!SND.ready || !SND.on) return;
  for(const v of SND.voices){ if(!v.h || v.h<0.02) continue; const s=v.site, n=nodes[s.node], jx=n.x+(Math.random()-0.5)*90, jy=n.y+(Math.random()-0.5)*90;
    if(v.kind==='city' && Math.random()<(s.id==='praha'?0.45:0.25)*(daylight()<0.3?0.3:1)) sndCarHorn(jx,jy);
    else if(s.id==='mb' && Math.random()<0.6) sndWrench(jx,jy);
    else if((s.id==='trinec'||s.id==='karvina'||s.id==='ostrava') && Math.random()<0.25) sndClank(jx,jy);
    else if((v.kind==='field' || s.id==='zatec' || s.id==='mikulov' || s.id==='valtice') && daylight()>0.4 && Math.random()<0.3) sndBird(jx,jy); }
  if(daylight()>0.4 && Math.random()<0.25){ const lx=target.x+CX+(Math.random()-0.5)*200, ly=target.z+CZ+(Math.random()-0.5)*200; if(!SITES.some(s=>{ const n=nodes[s.node]; return Math.hypot(n.x-lx,n.y-ly)<150 && s.kind==='city'; })) sndBird(lx,ly); }
},700);

let lastMenuDraw=0;
let frameErr=0;
function frame(now){ try{ frameBody(now); }catch(e){ if(frameErr++<5) console.error(e); } requestAnimationFrame(frame); }   // one bad frame never stops the game
function frameBody(now){
  const real=Math.min(0.05,(now-last)/1000); last=now; keyPan(real);
  const dt=menuEl.hidden ? real*SPEEDS[speedIdx] : 0; const n=Math.ceil(dt/0.25); for(let i=0;i<n;i++) step(dt/n);
  renderClock(); applyDaylight(); if(tool==='route' && rStops.length>1 && Math.abs(camD/routeZoom-1)>0.25) renderRoute();
  for(const tr of trains) placeTrain(tr,now,real);
  planeTick(real); peopleTick(real);
  for(const [id,o] of signalMeshes){ const red=trains.some(t=>t.st==='hold'&&t.path&&t.path[t.pi]===id) || (entrySig.has(id) && [...(adj.get(id)||[])].some(x=>{ const po=portOf.get(x); return po && trainsAt(po.s.node).some(t=>t.plat===po.k); })) || [...(adj.get(id)||[])].some(x=>occ.has(ekey(id,x))); o.l1.material=red?LIGHT_OFF:LIGHT_G; o.l2.material=red?LIGHT_R:LIGHT_OFF; }
  if(tool==='track' && anchor!=null){ const nd=anchorPos(); ring.visible=true; ring.position.set(nd.x-CX,3,nd.y-CZ); const s=1+Math.sin(now/180)*0.12; ring.scale.set(s,s,s); } else ring.visible=false;
  const k=Math.max(0.35,camD/620); for(const sp of labelOf.values()) sp.scale.set(112*k,32.8*k,1); for(const sp of parkLabels) sp.scale.set(84*k,15.8*k,1);
  updateSmoke(real); waterTex.offset.x+=real*0.004; waterTex.offset.y+=real*0.002; lakeTex.offset.x+=real*0.0002;
  for(let i=effects.length-1;i>=0;i--){ const f=effects[i]; f.t+=real; const s=3+f.t*24; f.ball.scale.set(s,s,s); f.ball.material.opacity=Math.max(0,1-f.t/0.6); if(f.t>0.7){ scene.remove(f.g); effects.splice(i,1); } }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.t+=real; v3.set(f.x-CX,20,f.y-CZ).project(camera);
    const tt=Math.max(0,f.t); const x=(v3.x+1)/2*W, y=(1-v3.y)/2*H-tt*40; f.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`; f.el.style.opacity=f.t<0?'0':String(Math.max(0,1-tt/1.4));
    if(f.t>1.4){ f.el.remove(); floats.splice(i,1); } }
  if(W&&H && (menuEl.hidden || now-lastMenuDraw>400)){ renderer.render(scene,camera); if(!menuEl.hidden) lastMenuDraw=now; }
}
applyStatic(); setTool('pan'); rebuildTracks(); renderNeeds(); resize(); $('speed').textContent=SPEED_LABEL[speedIdx]; setMoney(money);
try{ if(W&&H){ renderer.compile(scene,camera); renderer.render(scene,camera); } }catch(e){}   // shaders compiled while the loading screen is still up
$('loading').remove();
requestAnimationFrame(frame);
initAccount();
// offline cache and installing as an app on the phone both need the service worker
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
